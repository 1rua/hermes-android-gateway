[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-android-intelligence-hermes-gateway"
version = "3.0.0"
description = "Optional Hermes native Session Adapter for the independent OAI Core"
requires-python = ">=3.11"
dependencies = [
  "open-android-intelligence-core>=0.2,<0.3",
  "oai-hermes-session-adapter>=0.2,<0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["open_android_intelligence_gateway*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
