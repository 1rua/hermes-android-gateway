name: session-adapter-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve the exact paired Core source
        id: core
        run: |
          python -c 'import json,os,re; p=json.load(open("oai-core-pin.json")); s=p["revision"]; assert re.fullmatch("[0-9a-f]{40}",s); open(os.environ["GITHUB_OUTPUT"],"a").write("revision="+s+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: 1rua/open-android-intelligence
          ref: ${{ steps.core.outputs.revision }}
          path: .core-source
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 75b083e9399115b12513385252811f09c3503c90
          path: .hermes-native-sdk
      - name: Install paired Core and optional adapter
        run: >-
          python -m pip install ./.core-source/oai-core
          ./.core-source/integrations/hermes-session-adapter .
          pytest pytest-asyncio PyYAML==6.0.3 python-dotenv==1.2.4 psutil==7.2.2 httpx==0.28.1
      - name: Verify thin plugin surface
        run: |
          python -m pytest tests -q
          python scripts/check_plugin_manifest.py
        env:
          PYTHONPATH: .hermes-native-sdk
      - name: Verify paired native sessions and account isolation
        run: >-
          python -m pytest .core-source/oai-core/tests/test_hermes.py
          .core-source/oai-core/tests/test_hermes_native.py
          .core-source/oai-core/tests/test_hermes_interactions.py
          .core-source/oai-core/tests/test_interaction_pipeline.py -q
        env:
          HERMES_SDK_ROOT: .hermes-native-sdk
