name: plugin-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The interpreter Hermes Agent ships, so a syntax or dependency
          # change that only works on a newer Python fails here rather than
          # inside a user host.
          python-version: "3.11"

      - name: Resolve the pinned contract revision
        id: pin
        run: |
          revision=$(python -c "import json;print(json.load(open(\"contract-pin.json\"))[\"revision\"])")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Gateway Protocol contract
        uses: actions/checkout@v4
        with:
          repository: 1rua/open-android-intelligence
          ref: ${{ steps.pin.outputs.revision }}
          path: .contract-source
          sparse-checkout: gateway-contract

      # 固定现有部署的原生 SDK，防止原生历史回归因未安装宿主而被跳过。
      - name: Check out the pinned Hermes native SDK
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 75b083e9399115b12513385252811f09c3503c90
          path: .hermes-native-sdk

      - name: Install dependencies
        run: python -m pip install pytest jsonschema aiohttp cryptography PyYAML==6.0.3 httpx==0.28.1 python-dotenv==1.2.4 psutil==7.2.2

      # The negotiation tests compare the real shipped Schema digest, so the
      # suite runs against the contract this plugin actually pins.
      - name: Run tests
        run: |
          python -m pytest tests \
            --ignore=tests/test_native_history_complete.py \
            --ignore=tests/test_native_history_projection.py \
            --ignore=tests/test_native_streaming_delivery.py
        env:
          OPEN_ANDROID_GATEWAY_CONTRACT_ROOT: ${{ github.workspace }}/.contract-source/gateway-contract
          HERMES_SDK_ROOT: ${{ github.workspace }}/.hermes-native-sdk
          HERMES_HOME: ${{ runner.temp }}/oai-native-hermes-ci
          HERMES_TEST_ISOLATION: ${{ runner.temp }}/oai-native-hermes-ci

      - name: Verify the real Hermes native history and transports
        # 正常矩阵约数十秒；停滞时保留具体用例与调用栈，避免无限占用流水线。
        timeout-minutes: 5
        run: |
          python -m pytest -vv -o faulthandler_timeout=30 \
            tests/test_native_history_complete.py \
            tests/test_native_history_projection.py \
            tests/test_native_streaming_delivery.py \
            tests/test_native_turn_lifecycle.py \
            tests/test_native_turn_review_boundaries.py \
            tests/test_android_echo_fixture.py
        env:
          OPEN_ANDROID_GATEWAY_CONTRACT_ROOT: ${{ github.workspace }}/.contract-source/gateway-contract
          HERMES_SDK_ROOT: ${{ github.workspace }}/.hermes-native-sdk
          PYTHONPATH: ${{ github.workspace }}/.hermes-native-sdk
          HERMES_HOME: ${{ runner.temp }}/oai-native-hermes-regression
          HERMES_TEST_ISOLATION: ${{ runner.temp }}/oai-native-hermes-regression
          OAI_REQUIRE_NATIVE_HERMES: "1"

      - name: Check the manifest, the entry point and the protocol agreement
        run: |
          python -m pip install pyyaml
          python scripts/check_plugin_manifest.py
