manifest_version: 2
name: open-android-intelligence-gateway
label: OAI Hermes Session Adapter
version: 3.0.0
description: Optional Hermes native session bridge for OAI Core; no device Gateway.
author: Open Android Intelligence
kind: platform
license: MIT
homepage: https://github.com/1rua/hermes-android-gateway
python_runtime: ">=3.11"
requires_hermes: ">=0.20.0"
provides_tools: []
provides_hooks: []
requires_env:
  - OAI_HERMES_SESSION_TOKEN
  - OAI_HERMES_GATEWAY_ROOT
  - OAI_HERMES_ACCOUNTS
optional_env:
  - OAI_HERMES_SESSION_PORT
  - OPEN_ANDROID_INTELLIGENCE_GATEWAY_MASTER_KEY_FILE
